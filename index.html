<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Semua Link — Percobaan</title>
<meta name="theme-color" content="#0d0f14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0f14;
    --surface: #161922;
    --surface-hover: #1d212c;
    --border: #262b38;
    --text: #eceef2;
    --text-dim: #8b91a3;
    --accent: #f2b84b;
    --accent-2: #5b8def;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 20px 80px;
  }

  .kicker{
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(32px, 6vw, 44px);
    font-weight: 700;
    margin: 8px 0 12px;
    letter-spacing: -0.01em;
  }

  .sub{
    color: var(--text-dim);
    font-size: 15px;
    max-width: 46ch;
    margin-bottom: 32px;
  }

  .search{
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 36px;
  }

  .search svg{ flex-shrink:0; opacity:0.5; }

  .search input{
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    width: 100%;
  }

  .search input::placeholder{ color: var(--text-dim); }

  .group{ margin-bottom: 32px; }

  .group-title{
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .cards{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card{
    display:flex;
    align-items:center;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    text-decoration:none;
    color: var(--text);
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .card:hover{
    background: var(--surface-hover);
    border-color: var(--dot, var(--border));
  }

  .dot{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--dot);
  }

  .card-body{ flex: 1; min-width: 0; }

  .card-name{
    font-weight: 500;
    font-size: 15px;
    margin: 0 0 2px;
  }

  .card-url{
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .copy-btn{
    flex-shrink:0;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .copy-btn:hover{
    color: var(--text);
    border-color: var(--text-dim);
  }

  .copy-btn.copied{
    color: var(--accent);
    border-color: var(--accent);
  }

  .empty{
    color: var(--text-dim);
    font-size: 14px;
    padding: 24px 0;
    display:none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">@bryantadelar @striveunite</div>
    <h1>PRIVATE DATA</h1>
    <p class="sub">CONFIDENTIAL! Klik untuk buka, atau tekan SALIN untuk kirim linknya.</p>

    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Cari nama atau kategori...">
    </div>

    <div id="results"></div>
    <div class="empty" id="emptyState">Tidak ada yang cocok. Coba kata kunci lain.</div>
  </div>

<script>
  // ====== INI SATU-SATUNYA BAGIAN YANG PERLU DIUBAH KALAU MAU NAMBAH LINK ======
  // Setiap kategori punya "name" dan "color" (dipakai buat titik warna),
  // lalu daftar "items" berisi nama tampilan + url.
  const DATA = [
    {
      category: "MATERI 2026",
      color: "#f2b84b",
      items: [
        { name: "WHAT'S NEXT — Pioneers Event", url: "https://what-s-next-pioneers-event-cd466326-eight.vercel.app/" },
        { name: "Meeting Leader (Sept 26)", url: "https://meetingleader-sept26.vercel.app/" },
        { name: "the unseen ladder", url: "https://the-unseen-ladder-strive-unite-fab4.vercel.app/" },
      ]
    }
  ];
  // ================================================================

  const resultsEl = document.getElementById('results');
  const emptyEl = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');

  function render(filter = '') {
    const q = filter.trim().toLowerCase();
    resultsEl.innerHTML = '';
    let totalShown = 0;

    DATA.forEach(group => {
      const filteredItems = group.items.filter(item =>
        item.name.toLowerCase().includes(q) || group.category.toLowerCase().includes(q)
      );
      if (filteredItems.length === 0) return;
      totalShown += filteredItems.length;

      const groupEl = document.createElement('div');
      groupEl.className = 'group';

      const titleEl = document.createElement('div');
      titleEl.className = 'group-title';
      titleEl.textContent = group.category;
      groupEl.appendChild(titleEl);

      const cardsEl = document.createElement('div');
      cardsEl.className = 'cards';

      filteredItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.setProperty('--dot', group.color);

        const link = document.createElement('a');
        link.href = item.url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.style.cssText = 'display:flex;align-items:center;gap:14px;flex:1;min-width:0;text-decoration:none;color:inherit;';
        link.innerHTML = `
          <span class="dot" style="background:${group.color}"></span>
          <span class="card-body">
            <p class="card-name">${item.name}</p>
            <p class="card-url">${item.url.replace(/^https?:\/\//, '')}</p>
          </span>
        `;

        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Salin';
        btn.onclick = () => {
          navigator.clipboard.writeText(item.url).then(() => {
            btn.textContent = 'Tersalin';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = 'Salin'; btn.classList.remove('copied'); }, 1500);
          });
        };

        card.appendChild(link);
        card.appendChild(btn);
        cardsEl.appendChild(card);
      });

      groupEl.appendChild(cardsEl);
      resultsEl.appendChild(groupEl);
    });

    emptyEl.style.display = totalShown === 0 ? 'block' : 'none';
  }

  searchInput.addEventListener('input', (e) => render(e.target.value));
  render();
</script>
</body>
</html>
