<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Semua Link — Percobaan</title>
<meta name="theme-color" content="#0d0f14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0f14;
    --surface: #161922;
    --surface-hover: #1d212c;
    --border: #262b38;
    --text: #eceef2;
    --text-dim: #8b91a3;
    --accent: #f2b84b;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 20px 80px;
  }

  .kicker{
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(32px, 6vw, 44px);
    font-weight: 700;
    margin: 8px 0 12px;
    letter-spacing: -0.01em;
  }

  .sub{
    color: var(--text-dim);
    font-size: 15px;
    max-width: 46ch;
    margin-bottom: 32px;
  }

  .search{
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 36px;
  }

  .search svg{ flex-shrink:0; opacity:0.5; }

  .search input{
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    width: 100%;
  }

  .search input::placeholder{ color: var(--text-dim); }

  /* ---- Folder (kategori) ---- */
  .folder{
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 14px;
    overflow: hidden;
    background: var(--surface);
  }

  .folder-header{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 16px 18px;
    cursor: pointer;
    user-select: none;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    color: var(--text);
    font-family: inherit;
  }

  .folder-header:hover{ background: var(--surface-hover); }

  .folder-dot{
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .folder-title-wrap{ flex: 1; min-width: 0; }

  .folder-title{
    font-weight: 600;
    font-size: 15px;
    margin: 0;
  }

  .folder-desc{
    font-size: 13px;
    color: var(--text-dim);
    margin: 2px 0 0;
  }

  .folder-count{
    font-size: 12px;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  .chevron{
    flex-shrink: 0;
    transition: transform 0.2s ease;
    opacity: 0.6;
  }

  .folder.open .chevron{ transform: rotate(180deg); }

  .folder-body{
    display: none;
    padding: 4px 18px 18px;
  }

  .folder.open .folder-body{ display: block; }

  /* ---- Kartu item (di dalam folder) ---- */
  .cards{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
  }

  .card{
    display:flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    min-height: 100px;
  }

  .card-link{
    display:flex;
    flex-direction: column;
    gap: 4px;
    text-decoration:none;
    color: var(--text);
  }

  .card-name{
    font-weight: 500;
    font-size: 14px;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-desc{
    font-size: 12px;
    color: var(--text-dim);
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .copy-btn{
    align-self: flex-start;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .copy-btn:hover{ color: var(--text); border-color: var(--text-dim); }
  .copy-btn.copied{ color: var(--accent); border-color: var(--accent); }

  .empty{
    color: var(--text-dim);
    font-size: 14px;
    padding: 24px 0;
    display:none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">@bryantadelar @striveunite</div>
    <h1>ALL CONFIDENTIAL</h1>
    <p class="sub">Hi, ini data confidential @bryantadelar. Klik kategori untuk buka, klik sub-kategori untuk buka link, atau tekan SALIN untuk kirim linknya.</p>

    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Cari nama, keterangan, atau kategori...">
    </div>

    <div id="results"></div>
    <div class="empty" id="emptyState">Tidak ada yang cocok. Coba kata kunci lain.</div>
  </div>

<script>
  // ====== INI SATU-SATUNYA BAGIAN YANG PERLU DIUBAH KALAU MAU NAMBAH/EDIT LINK ======
  // Tiap kategori: category (nama), color (warna kotak), desc (keterangan kategori, boleh kosong "")
  // Tiap item: name, url, desc (keterangan item, boleh kosong "")
  const DATA = [
    {
      category: "MATERI BRYANT",
      color: "#f2b84b",
      desc: "",
      items: [
        { name: "WHAT'S NEXT — Pioneers Event", url: "https://what-s-next-pioneers-event-cd466326-eight.vercel.app/", desc: "" },
        { name: "Meeting Leader (Sept 26)", url: "https://meetingleader-sept26.vercel.app/", desc: "" },
        { name: "the unseen ladder", url: "https://the-unseen-ladder-strive-unite-fab4.vercel.app/", desc: "" }
      ]
    },
    {
      category: "MATERI STR ACADEMY",
      color: "#5b8def",
      desc: "",
      items: [
        // tinggal isi nanti, format: { name: "Nama", url: "https://...", desc: "Keterangan singkat" }
      ]
    },
    {
      category: "CALENDAR STRIVE",
      color: "#7ee081",
      desc: "",
      items: [
        { name: "CALENDAR", url: "https://calendar.google.com/calendar/u/5/r", desc: "" }
      ]
    }
  ];
  // ================================================================

  const resultsEl = document.getElementById('results');
  const emptyEl = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');
  const openState = new Set(); // index kategori yang lagi kebuka manual

  function matches(text, q){
    return text.toLowerCase().includes(q);
  }

  function render(filter = '') {
    const q = filter.trim().toLowerCase();
    resultsEl.innerHTML = '';
    let totalShown = 0;

    DATA.forEach((group, groupIndex) => {
      const filteredItems = q
        ? group.items.filter(item =>
            matches(item.name, q) || matches(item.desc || '', q) || matches(group.category, q)
          )
        : group.items;

      if (q && filteredItems.length === 0) return;
      totalShown += filteredItems.length;

      const isOpen = q !== '' || openState.has(groupIndex);

      const folder = document.createElement('div');
      folder.className = 'folder' + (isOpen ? ' open' : '');

      const header = document.createElement('button');
      header.type = 'button';
      header.className = 'folder-header';
      header.innerHTML = `
        <span class="folder-dot" style="background:${group.color}"></span>
        <span class="folder-title-wrap">
          <p class="folder-title">${group.category}</p>
          ${group.desc ? `<p class="folder-desc">${group.desc}</p>` : ''}
        </span>
        <span class="folder-count">${group.items.length} link</span>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      `;
      header.onclick = () => {
        if (openState.has(groupIndex)) openState.delete(groupIndex);
        else openState.add(groupIndex);
        render(searchInput.value);
      };

      const body = document.createElement('div');
      body.className = 'folder-body';

      const cardsEl = document.createElement('div');
      cardsEl.className = 'cards';

      filteredItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const link = document.createElement('a');
        link.className = 'card-link';
        link.href = item.url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.innerHTML = `
          <p class="card-name">${item.name}</p>
          ${item.desc ? `<p class="card-desc">${item.desc}</p>` : ''}
        `;

        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Salin';
        btn.onclick = () => {
          navigator.clipboard.writeText(item.url).then(() => {
            btn.textContent = 'Tersalin';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = 'Salin'; btn.classList.remove('copied'); }, 1500);
          });
        };

        card.appendChild(link);
        card.appendChild(btn);
        cardsEl.appendChild(card);
      });

      body.appendChild(cardsEl);
      folder.appendChild(header);
      folder.appendChild(body);
      resultsEl.appendChild(folder);
    });

    emptyEl.style.display = totalShown === 0 && q !== '' ? 'block' : 'none';
  }

  searchInput.addEventListener('input', (e) => render(e.target.value));
  render();
</script>
</body>
</html>
